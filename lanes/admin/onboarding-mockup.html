<title>GreenReserve HQ Onboarding</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;600&family=Libre+Franklin:wght@400;500;600;700&display=swap">
<style>
/* Layout: a picker strip on top (direction · theme · accents), then the admin Overview inside a framed "app":
   rail on the left, top bar with search / quick actions / alerts, six number cards, the revenue chart,
   then Recent activity and Needs attention. Every look is a token swap on .app[data-dir][data-mode][data-acc]. */
:root{
  --page:#EDEEE9;--page-ink:#141814;--page-muted:#5F645E;--page-line:#D7D9D1;--chip:#FFFFFF;
  --serif:"EB Garamond",Georgia,"Times New Roman",serif;
  --sans:"Libre Franklin",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#121512;--page-ink:#ECEEE8;--page-muted:#9A9F97;--page-line:#2C312C;--chip:#1C211C;color-scheme:dark}}
:root[data-theme="dark"]{--page:#121512;--page-ink:#ECEEE8;--page-muted:#9A9F97;--page-line:#2C312C;--chip:#1C211C;color-scheme:dark}
body{background:var(--page);color:var(--page-ink);font-family:var(--sans);font-size:14px;line-height:1.45}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px;display:flex;flex-direction:column;gap:16px}
.picker{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center}
.picker h1{font-family:var(--serif);font-weight:600;font-size:24px;margin:0 auto 0 0;line-height:1.1}
.pick{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pick > span{font-size:12.5px;color:var(--page-muted)}
.seg{display:inline-flex;background:var(--chip);border:1px solid var(--page-line);border-radius:999px;padding:3px}
.seg button{font:inherit;font-size:13px;font-weight:500;border:0;background:transparent;color:var(--page-ink);padding:6px 12px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--page-ink);color:var(--page)}
.seg button:focus-visible{outline:2px solid #3BAA6B;outline-offset:2px}
.note{font-size:12.5px;color:var(--page-muted);max-width:75ch}

/* ───────── The app: tokens per direction × mode ───────── */
.app{
  --bg:#E6EFEA; --blob1:#9FD3B5; --blob2:#CFE7D8; --blob3:#F1E3C4;
  --panel:rgba(255,255,255,.52); --panel-solid:#FFFFFF; --panel-edge:rgba(255,255,255,.75); --panel-blur:22px;
  --ink:#122219; --ink-soft:#3B4A41; --muted:#5E6C63; --line:rgba(18,34,25,.10);
  --rail:rgba(255,255,255,.38); --hover:rgba(255,255,255,.55); --active:rgba(255,255,255,.85);
  --shadow:0 1px 0 rgba(255,255,255,.6) inset, 0 8px 30px rgba(23,59,42,.08);
  --radius:18px; --radius-s:12px;
  --brand:#173B2A; --brand-ink:#FFFFFF; --fair:#3BAA6B; --up:#1F7A4A; --down:#A3452F; --warn:#9A5B13;
  --chart:#173B2A; --chart-fill:rgba(23,59,42,.16); --chart-prev:rgba(18,34,25,.28); --grid:rgba(18,34,25,.08);
  --t1:#173B2A; --t1-ink:#F3F7F4; --t2:#C9A24A; --t2-ink:#1E1606;
  position:relative;isolation:isolate;overflow:hidden;border-radius:24px;background:var(--bg);color:var(--ink);
  display:grid;grid-template-columns:232px minmax(0,1fr);min-height:760px;
  box-shadow:0 0 0 1px var(--page-line);
}
/* Green glass, dark */
.app[data-dir="green"][data-mode="dark"]{
  --bg:#0D1F19; --blob1:#1E6B4A; --blob2:#123B2E; --blob3:#3B5E3A;
  --panel:rgba(22,52,42,.48); --panel-solid:#14302A; --panel-edge:rgba(160,230,195,.14);
  --ink:#E8F2EC; --ink-soft:#BFD2C7; --muted:#8FA79A; --line:rgba(200,240,220,.10);
  --rail:rgba(14,36,29,.45); --hover:rgba(60,140,100,.16); --active:rgba(120,210,160,.18);
  --shadow:0 1px 0 rgba(200,255,225,.08) inset, 0 10px 34px rgba(0,0,0,.30);
  --brand:#4CC183; --brand-ink:#0B1F16; --up:#6DD39A; --down:#F08C78; --warn:#E3B05C;
  --chart:#7FE0A8; --chart-fill:rgba(127,224,168,.16); --chart-prev:rgba(232,242,236,.30); --grid:rgba(232,242,236,.07);
  --t1:#2E8F5E; --t1-ink:#F1FBF5; --t2:#D9B45A; --t2-ink:#1E1606;
}
/* Light iridescent glass */
.app[data-dir="iri"]{
  --bg:#EEF0F5; --blob1:#C8E8D6; --blob2:#E6D5F2; --blob3:#F7E0C8;
  --panel:rgba(255,255,255,.58); --panel-edge:rgba(255,255,255,.85);
  --ink:#16181D; --ink-soft:#3D4250; --muted:#646A78; --line:rgba(22,24,29,.09);
  --rail:rgba(255,255,255,.45); --hover:rgba(255,255,255,.6); --active:#FFFFFF;
  --shadow:0 1px 0 rgba(255,255,255,.9) inset, 0 10px 34px rgba(40,40,80,.08);
  --chart:#173B2A; --chart-fill:rgba(59,170,107,.15); --grid:rgba(22,24,29,.07); --chart-prev:rgba(22,24,29,.25);
}
.app[data-dir="iri"][data-mode="dark"]{
  --bg:#14151C; --blob1:#1F5B43; --blob2:#3E2D5C; --blob3:#5A3F24;
  --panel:rgba(32,34,46,.55); --panel-solid:#20222E; --panel-edge:rgba(255,255,255,.10);
  --ink:#ECEEF4; --ink-soft:#C3C7D3; --muted:#9298A8; --line:rgba(255,255,255,.08);
  --rail:rgba(24,25,34,.5); --hover:rgba(255,255,255,.06); --active:rgba(255,255,255,.12);
  --shadow:0 1px 0 rgba(255,255,255,.06) inset, 0 10px 34px rgba(0,0,0,.35);
  --brand:#4CC183; --brand-ink:#0B1F16; --up:#6DD39A; --down:#F08C78; --warn:#E3B05C;
  --chart:#7FE0A8; --chart-fill:rgba(127,224,168,.14); --chart-prev:rgba(236,238,244,.28); --grid:rgba(236,238,244,.06);
  --t1:#2E8F5E; --t1-ink:#F1FBF5; --t2:#D9B45A; --t2-ink:#1E1606;
}
/* Charcoal (solid, raised cards — no glass) */
.app[data-dir="char"]{
  --bg:#E9EAE6; --blob1:transparent; --blob2:transparent; --blob3:transparent;
  --panel:#F7F7F4; --panel-solid:#FFFFFF; --panel-edge:rgba(255,255,255,.9); --panel-blur:0px;
  --ink:#191B19; --ink-soft:#3E423E; --muted:#686D68; --line:rgba(0,0,0,.07);
  --rail:#E1E2DD; --hover:rgba(255,255,255,.6); --active:#F7F7F4;
  --shadow:0 1px 0 #fff inset, 0 6px 18px rgba(0,0,0,.07);
}
.app[data-dir="char"][data-mode="dark"]{
  --bg:#1E1F1E; --panel:#292A29; --panel-solid:#292A29; --panel-edge:rgba(255,255,255,.05);
  --ink:#EDEEEB; --ink-soft:#C6C8C3; --muted:#959893; --line:rgba(255,255,255,.07);
  --rail:#252625; --hover:rgba(255,255,255,.05); --active:#323432;
  --shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 10px 28px rgba(0,0,0,.35);
  --brand:#4CC183; --brand-ink:#0B1F16; --up:#6DD39A; --down:#F08C78; --warn:#E3B05C;
  --chart:#E7B45E; --chart-fill:rgba(231,180,94,.16); --chart-prev:rgba(237,238,235,.28); --grid:rgba(237,238,235,.06);
  --t1:#2E8F5E; --t1-ink:#F1FBF5; --t2:#D9B45A; --t2-ink:#1E1606;
}
/* Accent sets for the two highlighted tiles */
.app[data-acc="green"]{--t2:#3BAA6B;--t2-ink:#06180E}
.app[data-acc="multi"]{--t1:#E9874A;--t1-ink:#1F0E03;--t2:#4E8FE8;--t2-ink:#06142A}

/* Backdrop blobs: what the glass frosts. Plain blurred shapes, not a page gradient. */
.blob{position:absolute;border-radius:50%;filter:blur(70px);z-index:-1;pointer-events:none;opacity:.9}
.b1{width:520px;height:520px;background:var(--blob1);left:-120px;top:-140px}
.b2{width:560px;height:560px;background:var(--blob2);right:-160px;top:120px}
.b3{width:420px;height:420px;background:var(--blob3);left:38%;bottom:-200px}

.glass{background:var(--panel);-webkit-backdrop-filter:blur(var(--panel-blur)) saturate(1.3);backdrop-filter:blur(var(--panel-blur)) saturate(1.3);
  border:1px solid var(--panel-edge);border-radius:var(--radius);box-shadow:var(--shadow)}
@media (prefers-reduced-transparency:reduce){.glass{background:var(--panel-solid);-webkit-backdrop-filter:none;backdrop-filter:none}}

/* Rail */
.rail{background:var(--rail);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:18px;min-width:0}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.mark{width:34px;height:34px;border-radius:10px;background:var(--brand);display:grid;place-items:center;flex:none}
.mark svg{width:20px;height:20px}
.brand b{font-family:var(--serif);font-size:18px;font-weight:600;line-height:1}
.brand small{display:block;font-size:11.5px;color:var(--muted);margin-top:3px}
.grp{display:flex;flex-direction:column;gap:2px}
.grp > span{font-size:12.5px;font-weight:700;color:var(--ink);padding:0 10px 4px;letter-spacing:.02em}
.nav{font:inherit;font-size:13.5px;text-align:left;border:0;background:transparent;color:var(--ink-soft);padding:8px 10px;border-radius:10px;display:flex;justify-content:space-between;align-items:center;cursor:default}
.nav:hover{background:var(--hover)}
.nav.on{background:var(--active);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.nav i{font-style:normal;font-size:11.5px;font-weight:600;background:var(--warn);color:var(--panel-solid);border-radius:999px;padding:0 7px;line-height:18px}
.rail .foot{margin-top:auto;display:flex;align-items:center;gap:10px;padding:8px 6px;font-size:12.5px;color:var(--muted)}
.av{width:30px;height:30px;border-radius:50%;background:var(--t2);color:var(--t2-ink);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}

/* Main */
.main{padding:20px 24px 28px;display:flex;flex-direction:column;gap:18px;min-width:0}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top h2{font-family:var(--serif);font-weight:600;font-size:30px;line-height:1;margin:0 auto 0 0;letter-spacing:-.005em}
.top h2 small{display:block;font-family:var(--sans);font-size:13px;font-weight:400;color:var(--muted);margin-top:6px}
.search{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:12px;min-width:min(280px,100%);color:var(--muted);font-size:13px}
.search kbd{margin-left:auto;font:inherit;font-size:11.5px;border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.ibtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--panel-edge);color:var(--ink);position:relative}
.ibtn .dotn{position:absolute;top:9px;right:10px;width:7px;height:7px;border-radius:50%;background:var(--down)}
.qa{font:inherit;font-size:13px;font-weight:600;border:0;background:var(--brand);color:var(--brand-ink);padding:11px 16px;border-radius:12px;cursor:pointer;position:relative}
.qa:focus-visible{outline:2px solid var(--fair);outline-offset:2px}
.qmenu{position:absolute;right:0;top:calc(100% + 8px);width:220px;padding:6px;z-index:5;display:flex;flex-direction:column}
.qmenu span{padding:9px 12px;border-radius:9px;font-size:13.5px;color:var(--ink);font-weight:500;text-align:left}
.qmenu span:hover{background:var(--hover)}
.qwrap{position:relative}
.qmenu[hidden]{display:none}

/* KPI cards */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.kpi{padding:16px 16px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi .l{font-size:12.5px;color:var(--muted);font-weight:500}
.kpi .v{font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi .c{font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted)}
.kpi .c b{font-weight:600}
.up{color:var(--up)}.down{color:var(--down)}.wa{color:var(--warn)}
.kpi.t1{background:var(--t1);color:var(--t1-ink);border-color:transparent}
.kpi.t2{background:var(--t2);color:var(--t2-ink);border-color:transparent}
.kpi.t1 .l,.kpi.t1 .c,.kpi.t1 .c b,.kpi.t2 .l,.kpi.t2 .c,.kpi.t2 .c b{color:inherit;opacity:.85}
.spark{height:26px;margin-top:2px}
.spark path{fill:none;stroke:currentColor;stroke-width:1.6;opacity:.55}

/* Chart */
.chartcard{padding:18px 18px 10px;display:flex;flex-direction:column;gap:10px;min-width:0}
.chead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 18px}
.chead .big{font-size:30px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.chead .sub{font-size:12.5px;color:var(--muted)}
.chead .tabs{margin-left:auto;display:inline-flex;gap:2px;padding:3px;border-radius:11px;background:var(--hover);border:1px solid var(--line)}
.chead .tabs button{font:inherit;font-size:12.5px;font-weight:500;border:0;background:transparent;color:var(--ink-soft);padding:5px 11px;border-radius:8px;cursor:pointer}
.chead .tabs button[aria-pressed="true"]{background:var(--panel-solid);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.app[data-mode="dark"] .chead .tabs button[aria-pressed="true"]{background:var(--active)}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:14px;height:2px;margin-right:6px;vertical-align:3px;background:var(--chart)}
.legend span.prev::before{background:var(--chart-prev);height:0;border-top:2px dashed var(--chart-prev)}
.chartbox{width:100%;overflow-x:auto}
#chart{display:block;width:100%;min-width:520px;height:auto}
#chart text{fill:var(--muted);font-family:var(--sans);font-size:11px}

/* Two columns */
.two{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:12px}
.list{padding:16px 0 6px;min-width:0}
.list h3{font-size:15px;font-weight:600;margin:0;padding:0 18px 10px;display:flex;justify-content:space-between;align-items:baseline}
.list h3 span{font-size:12px;font-weight:500;color:var(--muted)}
.li{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:2px 12px;padding:11px 18px;border-top:1px solid var(--line);align-items:baseline}
.li .d{width:7px;height:7px;border-radius:50%;background:var(--muted);align-self:center}
.li .d.ok{background:var(--up)}.li .d.bad{background:var(--down)}.li .d.warn{background:var(--warn)}.li .d.br{background:var(--brand)}
.li .t{font-size:13.5px;overflow-wrap:anywhere}
.li .w{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.li .act{grid-column:3;grid-row:1;font:inherit;font-size:12.5px;font-weight:600;border:1px solid var(--line);background:var(--hover);color:var(--ink);padding:5px 10px;border-radius:9px;cursor:default;white-space:nowrap}
.attn .li{grid-template-columns:3px minmax(0,1fr) auto;padding-left:15px}
.attn .li .d{width:3px;height:100%;border-radius:2px;align-self:stretch}
.ex{font-size:11.5px;font-weight:600;letter-spacing:.04em;color:var(--warn);border:1px dashed currentColor;border-radius:999px;padding:2px 9px;white-space:nowrap}

@media (max-width:1180px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .rail{flex-direction:row;flex-wrap:wrap;align-items:center;border-right:0;border-bottom:1px solid var(--line);gap:8px 12px;padding:14px}
  .rail .grp,.rail .foot{display:none}
  .two{grid-template-columns:1fr}
}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.main{padding:16px 14px 22px}.kpi .v{font-size:23px}.top h2{font-size:26px}.app{border-radius:18px}}
@media (prefers-reduced-motion:no-preference){.app,.app *{transition:background-color .25s ease,color .25s ease,border-color .25s ease}}
</style>

<style>
/* Golf Courses page: a filter strip + the course directory (glass table), and the picked course's profile beside it. */
.fwrap{position:relative;align-self:flex-start}
.fbtn{font:inherit;font-size:13px;font-weight:600;color:var(--ink);display:inline-flex;align-items:center;gap:8px;padding:8px 14px;cursor:pointer}
.fmenu{position:absolute;left:0;top:calc(100% + 6px);z-index:5;flex-direction:column;align-items:stretch!important;padding:6px;min-width:200px;background:var(--panel-solid)}
.fmenu[hidden]{display:none!important}
.fmenu .chip{border:0;background:transparent;border-radius:9px;text-align:left;display:flex;justify-content:space-between}
.fmenu .chip[aria-pressed="true"]{background:var(--active);color:var(--ink)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{font:inherit;font-size:13px;font-weight:500;border:1px solid var(--line);background:var(--hover);color:var(--ink-soft);padding:6px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:transparent}
.chip b{font-weight:600;margin-left:4px;opacity:.75}
.find{margin-left:auto;display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;min-width:min(240px,100%);color:var(--muted);font-size:13px}
.split{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;align-items:start}
.dir{overflow:hidden}
.dir table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.dir th{font-size:12px;font-weight:500;color:var(--muted);text-align:left;padding:12px 14px;border-bottom:1px solid var(--line)}
.dir td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.dir tr:last-child td{border-bottom:0}
.dir th.n,.dir td.n{text-align:right}
.dir tbody tr{cursor:pointer}
.dir tbody tr:hover{background:var(--hover)}
.dir tbody tr[aria-selected="true"]{background:var(--active)}
.cname{font-weight:600;color:var(--ink)}
.csub{display:block;font-size:12px;color:var(--muted);font-weight:400}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;white-space:nowrap}
.st i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.st.live i{background:var(--up)}.st.onb i{background:var(--brand)}.st.risk i{background:var(--warn)}.st.off i{background:var(--down)}
.trend{font-size:12px}
.prof{padding:20px;display:flex;flex-direction:column;gap:16px;position:sticky;top:12px}
.ph{display:flex;gap:14px;align-items:center}
.plogo{width:52px;height:52px;border-radius:14px;background:var(--t1);color:var(--t1-ink);display:grid;place-items:center;font-family:var(--serif);font-weight:600;font-size:20px;flex:none}
.ph h3{font-family:var(--serif);font-weight:600;font-size:24px;margin:0;line-height:1.05}
.ph p{margin:3px 0 0;font-size:12.5px;color:var(--muted)}
.ptabs{display:flex;gap:2px;padding:3px;border-radius:11px;background:var(--hover);border:1px solid var(--line);flex-wrap:wrap}
.ptabs button{font:inherit;font-size:12.5px;font-weight:500;border:0;background:transparent;color:var(--ink-soft);padding:5px 10px;border-radius:8px;cursor:pointer}
.ptabs button[aria-pressed="true"]{background:var(--panel-solid);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.app[data-mode="dark"] .ptabs button[aria-pressed="true"]{background:var(--active)}
.pnums{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border-radius:12px;overflow:hidden}
.pnums div{background:var(--panel-solid);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.app[data-mode="dark"] .pnums div{background:rgba(20,48,40,.7)}
.pnums small{font-size:12px;color:var(--muted)}
.pnums b{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.pnums em{font-style:normal;font-size:12px;color:var(--muted)}
/* Cam 2026-11-12, "don't like how these cards look in the bottom": the bottom buttons and note boxes become plain lines and links. */
#prof .pbtns{gap:18px;border-top:1px solid var(--line);padding-top:12px}
#prof .pbtn{border:0;background:none;padding:0;font-weight:600;color:var(--brand);text-decoration:underline;text-decoration-color:var(--fair);text-underline-offset:3px}
#prof .pbtn.pri{background:none;color:var(--brand)}
#prof .psec .pbtns{border-top:0;padding-top:0}
#prof .note{background:none;border:0;border-left:2px solid var(--line);border-radius:0;padding:2px 0 2px 10px}
/* Cam 2026-11-12, "how could we make this look different": the two links move up beside the course name as small pills, not a row at the bottom. */
.ph{flex-wrap:wrap}
.plinks{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.plink{font-size:12.5px;font-weight:600;color:var(--brand);background:var(--hover);border:1px solid var(--line);border-radius:999px;padding:5px 11px;white-space:nowrap;cursor:default}
.plink:hover{background:var(--active)}
.psec{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:14px}
.psec h4{margin:0;font-size:13.5px;font-weight:600}
.pempty{margin:0;color:var(--muted);font-size:13.5px}
.kv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:8px 12px;font-size:13.5px}
.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere}
.steps{display:flex;flex-direction:column;gap:2px}
.step{display:flex;gap:10px;align-items:center;font-size:13.5px;padding:6px 0;border-top:1px solid var(--line)}
.step:first-child{border-top:0}
.step i{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--muted);flex:none;display:grid;place-items:center}
.step.done i{background:var(--up);border-color:var(--up)}
.step.done i::after{content:"";width:6px;height:3px;border-left:2px solid var(--panel-solid);border-bottom:2px solid var(--panel-solid);transform:rotate(-45deg) translate(1px,-1px)}
.step.done span{color:var(--muted)}
.note{font-size:13.5px;padding:10px 12px;border-radius:10px;background:var(--hover);border:1px solid var(--line)}
.note small{display:block;color:var(--muted);font-size:12px;margin-bottom:2px}
.pbtns{display:flex;gap:8px;flex-wrap:wrap}
.pbtn{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--hover);color:var(--ink);padding:8px 12px;border-radius:10px;cursor:default}
.pbtn.pri{background:var(--brand);color:var(--brand-ink);border-color:transparent}
/* Cam 2026-11-12, "no need for all these cards": one panel for list + profile, no boxes around search/find/alerts, numbers as rows. */
/* Cam 2026-11-12: the list and the profile are separate things, so two separate glass cards with a gap, as on the Overview. */
.split{gap:16px}
.top .search{min-width:min(320px,100%);border-radius:14px}
.top .ibtn,.filters .find{background:transparent;border:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;border-bottom:1px solid var(--line);border-radius:0}
.top .ibtn{border-bottom:0}
.pnums{display:block;background:none;border-radius:0}
.pnums div{background:none!important;padding:9px 0;border-top:1px solid var(--line);flex-direction:row;align-items:baseline;gap:10px}
.pnums div:first-child{border-top:0}
.pnums small{flex:1;font-size:13.5px;color:var(--ink-soft)}
.pnums b{font-size:16px}
.pnums em{min-width:110px;text-align:right}
@media (max-width:1100px){.split{grid-template-columns:1fr}}
@media (max-width:640px){.dir .hide-s{display:none}.kv{grid-template-columns:1fr}}

<style>
/* Onboarding: the pipeline strip (stages are the filter), then the courses in onboarding and the picked one's profile as two cards. */
.pipe{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.todo{padding:16px 0 8px;min-width:0}
.todo h3{margin:0;padding:0 18px 8px;font-size:15px;font-weight:600;display:flex;gap:8px;align-items:baseline}
.todo h3 span{font-size:12.5px;font-weight:500;color:var(--muted)}
.tline{font:inherit;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:transparent;color:var(--ink);padding:10px 18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;cursor:pointer}
.tline:hover{background:var(--hover)}
.tline[aria-pressed="true"]{background:var(--active)}
.tn{font-weight:600;font-size:13.5px}
.tdo{grid-column:1;font-size:13px;color:var(--ink-soft)}
.td{grid-column:2;grid-row:1 / 3;align-self:center;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.td.wa{color:var(--warn);font-weight:600}
@media (max-width:900px){.pipe{grid-template-columns:1fr}}
.stage{font:inherit;text-align:left;border:0;background:transparent;color:var(--ink);padding:12px 14px;border-radius:12px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0;position:relative}
.stage{padding:16px;gap:10px}
.stage .shead{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.stage .shead b{font-size:26px}
.stage .sfirst{display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--line);padding-top:10px;min-width:0}
.stage .sname{font-size:13.5px;font-weight:600;overflow-wrap:anywhere}
.stage .sdo{font-size:12.5px;color:var(--muted)}
.stage .sdo .wa{color:var(--warn);font-weight:600}
.stage.hot{box-shadow:inset 3px 0 0 var(--warn),var(--shadow)}
.stage[aria-pressed="true"]{outline:2px solid var(--brand);outline-offset:-2px}
.stage:hover{background:var(--hover)}
.stage[aria-pressed="true"]{background:var(--active);box-shadow:var(--shadow)}
.stage small{font-size:12.5px;color:var(--muted);font-weight:500}
.stage b{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.stage em{font-style:normal;font-size:12px;color:var(--muted)}
.stage em.wa{color:var(--warn);font-weight:600}
.olist table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.olist th{font-size:12px;font-weight:500;color:var(--muted);text-align:left;padding:12px 14px;border-bottom:1px solid var(--line)}
.olist td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.olist tr:last-child td{border-bottom:0}
.olist tbody tr{cursor:pointer}.olist tbody tr:hover{background:var(--hover)}.olist tbody tr[aria-selected="true"]{background:var(--active)}
.olist .n{text-align:right}
.days.wa{color:var(--warn);font-weight:600}
.olist .next{display:block;font-weight:500}
.olist .late{display:block;font-size:12px;color:var(--warn);font-weight:600;margin-top:2px}
.need{font-size:13px;font-weight:600;white-space:nowrap}
.need.wa{color:var(--warn)}
.next{font-weight:500}
.bar2{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}
.bar2 i{display:block;height:100%;background:var(--up)}
.step i{flex:none}
.step.now span{font-weight:600;color:var(--ink)}
.step.now i{border-color:var(--warn);border-width:2px}
.log{display:flex;flex-direction:column}
.log div{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px}
.log div:first-child{border-top:0}
.log small{color:var(--muted);font-size:12px}
.addnote{display:flex;gap:0;position:relative}
.addnote input{flex:1;min-width:0;font:inherit;font-size:13.5px;color:var(--ink);background:var(--hover);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.addnote input:focus{outline:2px solid var(--fair);outline-offset:1px}
.addnote input{padding-right:40px}
.addnote button{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--muted);padding:6px;border-radius:8px;cursor:pointer;display:grid;place-items:center}
.addnote button:hover{color:var(--brand);background:var(--hover)}
.nextbox b{display:block;font-size:15px}
.nextbox .nb{display:block;font-size:13px;color:var(--ink-soft);margin-top:2px}
.nextbox{border-left:3px solid var(--warn);padding:2px 0 2px 12px;font-size:14px}
.nextbox small{display:block;color:var(--muted);font-size:12px}
@media (max-width:1100px){.pipe{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:640px){.pipe{grid-template-columns:repeat(2,minmax(0,1fr))}.olist .hide-s{display:none}}
</style>

<script>
(function(){
  const app=document.getElementById("app");
  const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
  const seg=document.getElementById("segMode"); const saved=store.get("gr-mock-mode"); if(saved) app.dataset.mode=saved;
  const sync=()=>seg.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.v===app.dataset.mode)));
  seg.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;app.dataset.mode=b.dataset.v;store.set("gr-mock-mode",b.dataset.v);sync();});sync();
  const $=id=>document.getElementById(id);

  // The real pipeline stages, in plain words.
  const STAGES=[["new","New inquiry"],["review","Reviewing"],["waiting","Waiting on them"],["details","Details in"],["building","Building"],["live","Went live (30 days)"]];
  // Cam 2026-11-12, "less, more effective": four cards, each a group of stages that calls for the same kind of action.
  const GROUPS=[["lead","New leads",["new","review"],"to reply or demo"],["waiting","Waiting on them",["waiting"],"to chase"],["setup","Setting up",["details","building"],"for us to finish"],["live","Live this month",["live"],"to check in on"]];
  const inG=(c,g)=>g==="all"||GROUPS.find(x=>x[0]===g)[2].includes(c.stage);
  const STEPS=["Course information submitted","Agreement signed","Prices and fees set","Tee sheet schedule built","Stripe payments connected","Staff logins created","Test booking made","Approved and live"];
  const STUCK=7;
  const C=[
    {id:1,name:"Ridgewood Country Club",town:"Ridgewood, NJ",stage:"new",days:1,next:"Reply and book a demo",with:"Cam",steps:0,contact:"Kim Park · pro shop manager · (201) 555-0188",src:"Homepage inquiry",launch:"Not set",log:[["Nov 11","Inquiry: 18 holes, 2 courses, wants online booking before spring."]],notes:"",docs:"No agreement yet"},
    {id:2,name:"Brookside Golf Club",town:"Saratoga, NY",stage:"review",days:3,next:"Demo call Thu 2:00 PM",with:"Cam",steps:0,contact:"Ben Ortiz · GM · (518) 555-0103",src:"Cal.com demo booking",launch:"Not set",log:[["Nov 9","Booked a demo on Cal.com."],["Nov 8","Inquiry from the homepage."]],notes:"Uses paper tee sheet today.",docs:"No agreement yet"},
    {id:3,name:"Maple Bend Golf Course",town:"Kingston, NY",stage:"waiting",days:9,next:"Follow up on the unsigned agreement",with:"Cam",steps:1,contact:"Chris Bauer · owner · (845) 555-0161",src:"Referral",launch:"Dec 1",log:[["Nov 5","Agreement sent."],["Nov 4","Demo went well; wants to launch Dec 1."],["Nov 3","Inquiry."]],notes:"Price-sensitive; stress no monthly fee.",docs:"Agreement v2026-10 sent Nov 5 · not signed"},
    {id:4,name:"Willow Creek Golf Club",town:"Troy, NY",stage:"details",days:2,next:"Build the tee sheet schedule",with:"Cam",steps:2,contact:"Jordan Hale · GM · (518) 555-0199",src:"Homepage inquiry",launch:"Nov 24",log:[["Nov 10","Sent course details: prices, tees, hours."],["Nov 9","Agreement signed."]],notes:"",docs:"Agreement v2026-10 signed Nov 9"},
    {id:5,name:"Cedar Hills Golf Course",town:"Catskill, NY",stage:"building",days:4,next:"Connect Stripe payments",with:"Cam",steps:4,contact:"Riley Fox · owner · (518) 555-0147",src:"Outreach call",launch:"Nov 20",log:[["Nov 8","Schedule built, prices set."],["Nov 6","Details in."]],notes:"Wants carts required before 10 AM.",docs:"Agreement v2026-10 signed Nov 3"},
    {id:6,name:"Pine Hollow Golf Club",town:"Saratoga Springs, NY",stage:"live",days:58,next:"First-month check-in call",with:"Cam",steps:8,contact:"Dana Whitfield · GM · (518) 555-0142",src:"Outreach call",launch:"Went live Sep 14",log:[["Sep 14","Went live."]],notes:"",docs:"Agreement v2026-10 signed Sep 20"},
  ];
  let stage="all", pick=3;
  // Cam 2026-11-12: "what do you immediately need to know — who needs to be contacted or had stuff done." The top is two
  // to-do cards, most overdue first; clicking a line opens that course below. Counts of stages are gone from the top.
  const ACTS=[["call","Call or email them",["new","review","waiting","live"]],["do","Finish their setup",["details","building"]]];
  function pipe(){
    $("pipe").innerHTML=ACTS.map(([k,l,ss])=>{const list=C.filter(c=>ss.includes(c.stage)).sort((a,b)=>{const r=c=>c.stage==="live"?2:c.days>STUCK?0:1;return r(a)-r(b)||b.days-a.days;});
      return '<section class="todo glass"><h3>'+l+' <span>'+list.length+'</span></h3>'+list.map(c=>'<button type="button" class="tline" data-id="'+c.id+'" aria-pressed="'+(c.id===pick)+'"><span class="tn">'+c.name+'</span><span class="tdo">'+c.next+'</span><span class="td '+(c.days>STUCK&&c.stage!=="live"?"wa":"")+'">'+c.days+'d</span></button>').join("")+'</section>';}).join("");
    $("pipe").querySelectorAll(".tline").forEach(b=>b.addEventListener("click",()=>{pick=+b.dataset.id;stage="all";render();}));
  }
  function pipeOld(){
    $("pipe").innerHTML=GROUPS.map(([k,l,ss,why])=>{const list=C.filter(c=>ss.includes(c.stage));const stuck=k!=="live"?list.filter(c=>c.days>STUCK).length:0;
      // Cam 2026-11-12, "these can be better": each card names the one course to act on first and what to do.
      const top=list.slice().sort((a,b)=>b.days-a.days)[0];
      return '<button class="stage glass '+(stuck?"hot":"")+'" type="button" data-s="'+k+'" aria-pressed="'+(stage===k)+'"><span class="shead"><small>'+l+'</small><b>'+list.length+'</b></span>'+(top?'<span class="sfirst"><span class="sname">'+top.name+'</span><span class="sdo">'+top.next+' · <span class="'+(top.days>STUCK&&k!=="live"?"wa":"")+'">'+top.days+' days</span></span></span>':'<span class="sfirst sdo">Nothing here</span>')+'</button>';}).join("");
    $("pipe").querySelectorAll(".stage").forEach(b=>b.addEventListener("click",()=>{stage=stage===b.dataset.s?"all":b.dataset.s;const l=C.filter(c=>inG(c,stage));if(l.length&&!l.some(c=>c.id===pick))pick=l[0].id;render();}));
  }
  const sname=k=>STAGES.find(s=>s[0]===k)[1];
  function rows(){
    // Cam 2026-11-12: no cards on top — the list itself is sorted by what each course needs: overdue first, then
    // reach-outs, then our setup work, then check-ins on new live courses; longest wait first within each.
    const NEED=c=>c.stage==="live"?["Check in",3]:["details","building"].includes(c.stage)?["Our setup",2]:["Call or email",1];
    const rank=c=>(c.days>STUCK&&c.stage!=="live")?0:NEED(c)[1];
    // Cam 2026-11-12: one "Next step" column (no separate Needs); days only when it's late; Launch instead of days.
    const F={all:["All",()=>true],late:["Overdue",c=>rank(c)===0],call:["Call or email",c=>NEED(c)[1]===1],setup:["Our setup",c=>NEED(c)[1]===2],check:["Check in",c=>NEED(c)[1]===3]};
    $("filters").innerHTML=Object.entries(F).map(([k,[l,fn]])=>'<button class="chip" type="button" data-f="'+k+'" aria-pressed="'+(stage===k||(k==="all"&&!F[stage]))+'">'+l+'<b>'+C.filter(fn).length+'</b></button>').join("");
    const fn=(F[stage]||F.all)[1];
    const list=C.filter(fn).sort((a,b)=>rank(a)-rank(b)||b.days-a.days);
    $("rows").innerHTML=list.map(c=>'<tr tabindex="0" data-id="'+c.id+'" aria-selected="'+(c.id===pick)+'"><td><span class="cname">'+c.name+'</span><span class="csub">'+c.town+'</span></td><td>'+sname(c.stage)+'<div class="bar2"><i style="width:'+(c.steps/STEPS.length*100)+'%"></i></div></td><td><span class="next">'+c.next+'</span>'+(rank(c)===0?'<span class="late">'+c.days+' days waiting</span>':'')+'</td><td class="n hide-s">'+c.launch.replace("Went live ","Live ")+'</td></tr>').join("");
    $("rows").querySelectorAll("tr").forEach(tr=>{const go=()=>{pick=+tr.dataset.id;render();};tr.addEventListener("click",go);tr.addEventListener("keydown",e=>{if(e.key==="Enter")go();});});
  }
  const sec=(t,h)=>'<div class="psec"><h4>'+t+'</h4>'+h+'</div>';
  function prof(){
    const c=C.find(x=>x.id===pick); const init=c.name.split(" ").slice(0,2).map(w=>w[0]).join("");
    const nextIdx=c.steps;
    const head='<div class="ph"><span class="plogo">'+init+'</span><div><h3>'+c.name+'</h3><p>'+c.town+'</p></div><div class="plinks"><span class="plink">Inquiry →</span>'+(c.stage==="new"||c.stage==="review"?'<span class="plink">Book on Cal.com ↗</span>':'')+'</div></div>';
    // Cam 2026-11-12: just where they are and what to do — no "with Cam".
    // Cam 2026-11-12: "where they are in the process" — the step they're on out of 8, then what's needed to move it.
    const onStep=Math.min(c.steps,STEPS.length-1);
    const next='<div class="nextbox"><small>'+(c.steps>=STEPS.length?"All 8 steps done":"Step "+(onStep+1)+" of "+STEPS.length)+'</small><b>'+(c.steps>=STEPS.length?"Live":STEPS[onStep])+'</b><span class="nb">'+c.next+'</span></div>';
    const steps=sec('Setup · '+c.steps+' of '+STEPS.length+' done','<div class="steps">'+STEPS.map((s,i)=>'<div class="step '+(i<c.steps?"done":i===nextIdx?"now":"")+'"><i></i><span>'+s+'</span></div>').join("")+'</div>');
    const who=sec('Contact','<dl class="kv"><dt>Main contact</dt><dd>'+c.contact+'</dd><dt>Came from</dt><dd>'+c.src+'</dd><dt>Expected launch</dt><dd>'+c.launch+'</dd><dt>Agreement</dt><dd>'+c.docs+'</dd></dl>');
    const log=sec('History','<div class="log">'+c.log.map(l=>'<div><small>'+l[0]+'</small><span>'+l[1]+'</span></div>').join("")+'</div>');
    // Cam 2026-11-12, "how do you add a note": a field right in Notes; Enter or Add saves it on top, dated.
    c.added=c.added||[];
    const esc=t=>t.replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));
    const all=[...c.added,...(c.notes?[["Cam",c.notes]]:[])];
    const notes=sec('Notes','<div class="addnote"><input id="noteIn" type="text" placeholder="Add a note" aria-label="Add a note"><button type="button" id="noteAdd" aria-label="Save note"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div>'+(all.length?all.map(n=>'<div class="note"><small>'+n[0]+'</small>'+n[1]+'</div>').join(''):'<p class="pempty">No notes yet.</p>'));
    $("prof").innerHTML=head+next+steps+who+log+notes;
    const add=()=>{const v=$("noteIn").value.trim();if(!v)return;c.added.unshift(["Today · Cam",esc(v)]);prof();};
    $("noteAdd").addEventListener("click",add);$("noteIn").addEventListener("keydown",e=>{if(e.key==="Enter")add();});
  }
  const fb=$("fbtn"), fm=$("filters");
  fb.addEventListener("click",()=>{fm.hidden=!fm.hidden;fb.setAttribute("aria-expanded",String(!fm.hidden));});
  document.addEventListener("click",e=>{if(!e.target.closest(".fwrap")){fm.hidden=true;fb.setAttribute("aria-expanded","false");}});
  fm.addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;stage=b.dataset.f;$("flabel").textContent=stage==="all"?"Filter":"Filter: "+b.firstChild.textContent;fm.hidden=true;fb.setAttribute("aria-expanded","false");render();});
  function render(){rows();prof();}
  render();
})();
</script>
