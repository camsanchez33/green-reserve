<title>GreenReserve Emails and Texts</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;600&family=Libre+Franklin:wght@400;500;600&display=swap">
<style>
/* Layout: mockup chrome (tabs, switchers) around light email frames shown at phone or desktop width */
:root{
  --bg:#F3F4F0; --panel:#FFFFFF; --ink:#18201A; --muted:#5C655D; --line:#DCE0D8; --pine:#24563A; --note:#8A5A12; --note-bg:#FBF3E4;
  --ok:#2F6B45; --warn:#8A5A12; --bad:#9A3B2A;
  --serif:'EB Garamond',Georgia,'Times New Roman',serif; --sans:'Libre Franklin',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141815;--panel:#1C221E;--ink:#E8ECE6;--muted:#A3ACA4;--line:#2E3631;--pine:#7FBF96;--note:#E2B45E;--note-bg:#2A2418;--ok:#7FBF96;--warn:#E2B45E;--bad:#F08A78;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141815;--panel:#1C221E;--ink:#E8ECE6;--muted:#A3ACA4;--line:#2E3631;--pine:#7FBF96;--note:#E2B45E;--note-bg:#2A2418;--ok:#7FBF96;--warn:#E2B45E;--bad:#F08A78;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-family:var(--serif);font-weight:600;font-size:26px;margin:0 0 4px;text-wrap:balance}
h2{font-family:var(--serif);font-weight:600;font-size:21px;margin:0 0 6px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 16px;max-width:70ch}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.tabs button,.seg button{font:inherit;font-size:13px;font-weight:500;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 12px;border-radius:7px;cursor:pointer;min-height:36px}
.tabs button[aria-pressed="true"],.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:focus-visible,select:focus-visible{outline:2px solid var(--pine);outline-offset:2px}
.controls{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-bottom:16px;padding:12px;border:1px dashed var(--line);border-radius:10px}
.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.ctl>span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-right:2px}
.seg{display:flex;flex-wrap:wrap;gap:4px}
select{font:inherit;font-size:13px;padding:7px 10px;border-radius:7px;border:1px solid var(--line);background:var(--panel);color:var(--ink);min-height:36px;max-width:100%}
.stage{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
@media (max-width:900px){.stage{grid-template-columns:minmax(0,1fr)}}
.frame{background:#E9EBE6;border-radius:10px;padding:18px 10px;overflow-x:auto}
.frame.narrow .mail{max-width:375px}
.envelope{max-width:600px;margin:0 auto 10px;font-size:12.5px;color:#3E463F;background:#FFFFFF;border:1px solid #D6DAD2;border-radius:7px;padding:10px 12px}
.frame.narrow .envelope{max-width:375px}
.envelope b{color:#18201A;font-weight:600}
.envelope div{display:flex;gap:6px;flex-wrap:wrap}
.envelope span.k{color:#6B736C;min-width:56px}
.notes{display:grid;gap:10px}
.note{background:var(--note-bg);border:1px dashed var(--note);color:var(--ink);border-radius:10px;padding:12px 14px;font-size:13px}
.note b{color:var(--note);display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.counts{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.counts span{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:6px 10px;font-size:13px}
.groups{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.groups>section{min-width:0}
.scroller{overflow-x:auto}
.tbl{border-collapse:collapse;width:100%;font-size:13px}
.tbl th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
code{font-size:12px;color:var(--muted)}
.dot{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.dot::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.dot.ok{color:var(--ok)}.dot.warn{color:var(--warn)}.dot.bad{color:var(--bad)}
.texts{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.sms{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:10px;min-width:0}
.sms h3{margin:0;font-size:14px;font-weight:600}
.bubble{background:#E6E9E4;color:#18201A;border-radius:16px 16px 16px 4px;padding:10px 12px;font-size:14px;line-height:1.4;overflow-wrap:anywhere}
.meta{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.meta .two{color:var(--bad);font-weight:600}
.qs{display:grid;gap:12px;max-width:820px}
.q h3{margin:0 0 4px;font-size:15px}
.q p{margin:0 0 6px}
.q .rec{color:var(--ok);font-weight:600}
@media (prefers-reduced-motion:no-preference){.tabs button,.seg button{transition:background .12s,color .12s}}
</style>

<div class="wrap">
  <h1>Emails and texts</h1>
  <p class="sub">Mockup only. Look C (Letter), as chosen. Every golfer email comes from the course, says what happened in one line, shows the essentials and one button, and ends with the course’s details and "Powered by GreenReserve". Example course: Maple Run Golf Course.</p>

  <div id="main"></div>
</div>

function fromAddr(m){return m.kind==='outreach'?'admin@greenreserve.app':'noreply@greenreserve.app'}
function btn(m,txt,full){const a=brand(m);return `<a style="display:${full?'block':'inline-block'};text-align:center;background:${a.c};color:${a.ink};text-decoration:none;font:600 15px/1 ${F.sans};padding:14px 22px;border-radius:7px">${esc(txt)}&nbsp;→</a>`}
function links(m){return m.links&&m.links.length?`<p style="margin:12px 0 0;font:14px/1.5 ${F.sans};color:${F.body}">${m.links.map(l=>`<a style="color:${F.ink};text-decoration:underline">${esc(l)}</a>`).join(' &nbsp;·&nbsp; ')}</p>`:''}
function questions(m){return m.kind==='golfer'?'':false?`<p style="margin:0;font:14px/1.55 ${F.sans};color:${F.body}">Questions? Email ${C.email} or call ${C.phone}. Replies to this email aren’t read.</p>`:m.kind==='staff'?`<p style="margin:0;font:14px/1.55 ${F.sans};color:${F.body}">Questions? Ask in Course support in your dashboard. Replies to this email aren’t read.</p>`:''}
function footer(m){
  const stop=m.stopLink?`<br><a style="color:${F.muted};text-decoration:underline">${esc(m.stopLink)}</a>`:'';
  if(m.kind==='golfer')return `<p style="margin:0;font:12px/1.6 ${F.sans};color:${F.muted}"><span style="color:${F.ink}">${C.name}</span><br>${C.addr}<br>${C.phone}${stop}<br><span style="display:inline-flex;align-items:center;gap:6px;color:${F.muted}">Powered by <img src="${GR_LOGO}" alt="GreenReserve" width="86" height="16" style="display:inline-block;height:16px;width:86px;border:0;vertical-align:middle"></span></p>`;
  return `<p style="margin:0;font:12px/1.6 ${F.sans};color:${F.muted}">greenreserve.app</p>`;
}
function policyText(m){return (m.policyLead?`<b style="color:${F.ink}">${esc(m.policyLead)}</b> `:'')+esc(POLICY)}
function moneyRows(m,cellPad){
  if(!m.money&&!m.total)return '';
  const rows=(m.money||[]).map(r=>`<tr><td style="padding:${cellPad};font:14px/1.4 ${F.sans};color:${F.body}">${esc(r[0])}<br><span style="font-size:12px;color:${F.muted}">${esc(r[1])}</span></td><td style="padding:${cellPad};font:14px/1.4 ${F.sans};color:${F.ink};text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums">${esc(r[2])}</td></tr>`).join('');
  const t=m.total?`<tr><td style="padding:${cellPad};border-top:1px solid ${F.line};font:600 15px/1.4 ${F.sans};color:${F.ink}">${esc(m.total[0])}</td><td style="padding:${cellPad};border-top:1px solid ${F.line};font:600 15px/1.4 ${F.sans};color:${m.paid?F.ok:F.ink};text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums">${esc(m.total[1])}</td></tr>`:'';
  const note=m.moneyNote?`<p style="margin:8px 0 0;font:13px/1.5 ${F.sans};color:${F.muted}">${esc(m.moneyNote)}</p>`:'';
  return `<table role="presentation" style="width:100%;border-collapse:collapse">${rows}${t}</table>${note}`;
}

/* ---------- Notes beside each email ---------- */
function notesFor(m){
  const n=[];
  n.push(['Sender',`<b style="display:inline;text-transform:none;letter-spacing:0;font-size:13px;color:var(--ink)">${esc(fromName(m))}</b> &lt;${fromAddr(m)}&gt;. ${m.kind==='outreach'?'Replies come to Cam.':'No replies: the address doesn’t take mail, and the footer gives the course’s phone.'}`]);
  if(false)n.push(['Cancellation policy line','describePolicy() output, proposed wording. It stays as one line under the button because a fee charged to a saved card must be stated in the confirmation. The real text always comes from describePolicy(), so the email and the booking page can never disagree.']);
  if(D[m.id])n.push(['Body','One line saying what happened, the essentials, one big button. Everything else lives on the page the button opens.']);
  if(m.id==='receipt')n.push(['View receipt','Opens the receipt page (/receipt/…), on the course’s look, where the golfer can see or print it.']);
  if(m.id==='thanks')n.push(['Legal','About their round, so it’s a transactional email. It keeps a stop link for after-round emails.']);
  if(m.id==='alert')n.push(['Stop link','Every alert email can stop that alert in one tap (required for alerts).']);
  if(m.kind==='outreach')n.push(['Plain on purpose','Outreach stays a plain personal email in every option (your earlier answer): no layout, the logo, a postal address and a reply-to-stop line, as CAN-SPAM requires.']);
  if(m.kind==='staff')n.push(['Course and admin email','Same option, in GreenReserve green instead of the course colour.']);
  return n.map(x=>`<div class="note"><b>${x[0]}</b>${x[1]}</div>`).join('');
}

/* ---------- Texts ---------- */
const TX=[
 ['Booking confirmation','After booking, if they agreed to texts',`${C.name} booking confirmation: 4 players, 9 holes at 11:40 AM Sat Nov 21. Details: greenreserve.app/b/K7Q2X`],
 ['Reminder','Day before',`${C.name} reminder: 4 players, 18 holes tomorrow at 11:40 AM. Details: greenreserve.app/b/K7Q2X`],
 ['Pay link (round)','Staff texts a pay link',`${C.name} pay link: $270.00 for your 11:40 AM tee time. Pay: greenreserve.app/p/K7Q2X`],
 ['Receipt (round)','Staff texts a receipt',`${C.name} receipt: $270.00 paid. View: greenreserve.app/r/M4T8Z`],
 ['Event pay link','Entry fee link',`${C.name} event: Turkey Shoot Scramble entry, $45.00. Pay: greenreserve.app/p/E2W9L`],
 ['Pro shop pay link','Register sends a pay link',`${C.name} pro shop: $38.50 for your items. Pay: greenreserve.app/p/S9F3Q`],
 ['Pro shop receipt','Register sends a receipt',`${C.name} pro shop receipt: $38.50 paid. View: greenreserve.app/r/S9F3Q`],
 ['Note from the course','Staff message to the day’s golfers',`${C.name} update: frost delay. First tee times move back 30 min.`],
 ['Tee time alert','A watched time opens (alert-text consent only)',`${C.name} alert: a tee time opened Sat Nov 21 at 2:40 PM, room for 4. Book: greenreserve.app/a/H6N2`],
 ['Texts confirmed','Golfer agrees to texts',`${C.name}: You're set for booking texts, up to 4 per booking. Msg & data rates may apply. Reply HELP for help, STOP to opt out.`,'code'],
 ['HELP reply','Golfer texts HELP',`${C.name} booking texts. Questions? Call ${C.phone}. Msg & data rates may apply. Reply STOP to opt out.`,'code'],
 ['Staff sign-in code','Staff second factor',`GreenReserve code: 482915. It expires in 10 minutes. Don't share it.`,'code'],
];
const GSM=/^[A-Za-z0-9 \n\r@£$¥èéùìòÇØøÅå_ÆæßÉ!"#%&'()*+,\-./:;<=>?¡ÄÖÑÜ§¿äöñüà^{}\\\[~\]|€]*$/;
function seg(t){const g=GSM.test(t),n=t.length,one=g?160:70,multi=g?153:67;return {n,g,s:n<=one?1:Math.ceil(n/multi)}}
function txText(t){
  let s=t[2];
  if(t[3]==='code')return s;
  if(S.txt==='every'&&t[3]!=='optin')s+=' Powered by GreenReserve.';
  return s+' Reply STOP to opt out.';
}

/* ---------- Screens ---------- */
const SCREENS=[['emails','Emails'],['texts','Texts'],['inventory','Inventory'],['questions','Questions']];
function tabs(){document.getElementById('tabs').innerHTML=SCREENS.map(s=>`<button type="button" data-screen="${s[0]}" aria-pressed="${S.screen===s[0]}">${s[1]}</button>`).join('')}
function seg3(name,cur,opts){return `<div class="seg" role="group">${opts.map(o=>`<button type="button" data-${name}="${o[0]}" aria-pressed="${cur===o[0]}">${o[1]}</button>`).join('')}</div>`}
function emailsScreen(){
  const m=MAILS.find(x=>x.id===S.mail)||MAILS[0];
  const body=m.plain?outreach():optC(m);
  return `<div class="controls">
    <div class="ctl"><span>Email</span><select id="mailsel" aria-label="Email">${MAILS.map(x=>`<option value="${x.id}" ${x.id===m.id?'selected':''}>${esc(x.tab)}</option>`).join('')}</select></div>
    <div class="ctl"><span>Width</span>${seg3('width',S.width,[['wide','Desktop'],['narrow','Phone']])}</div>
    <div class="ctl"><span>Course colour</span>${seg3('accent',S.accent,[['green','Green'],['black','Black'],['blue','Blue'],['yellow','Yellow']])}</div>
  </div>
  <div class="stage">
    <div class="frame ${S.width==='narrow'?'narrow':''}">
      <div class="envelope"><div><span class="k">From</span><b>${esc(fromName(m))}</b>&lt;${fromAddr(m)}&gt;</div><div><span class="k">Subject</span><b>${esc(m.subject)}</b></div>${m.pre?`<div><span class="k">Preview</span>${esc(m.pre)}</div>`:''}</div>
      ${body}
    </div>
    <div class="notes">${notesFor(m)}<div class="note"><b>Cancellation policy</b>Not in the email. It lives on the booking details page the button opens; golfers agreed to it when they booked.</div><div class="note"><b>Footer</b>Course name, address and phone, then “Powered by GreenReserve”. Alert and after-round emails keep their stop link; outreach keeps a postal address and a reply-to-stop line, as the law requires.</div></div>
  </div>`;
}
function textsScreen(){
  const rows=TX.map(t=>{const s=txText(t),k=seg(s);return `<div class="sms"><h3>${esc(t[0])}</h3><div class="bubble">${esc(s)}</div><div class="meta"><span>${esc(t[1])}</span><span>${k.n} characters</span><span class="${k.s>1?'two':''}">${k.s===1?'1 text':k.s+' texts'}</span></div></div>`}).join('');
  const tot=TX.reduce((a,t)=>a+seg(txText(t)).s,0);
  return `<div class="controls"><div class="ctl"><span>Total</span><b style="font-variant-numeric:tabular-nums">${tot} text segments for these ${TX.length}</b></div></div>
  <p class="sub">Every course text starts with the course’s full name. Whether the first text and the HELP reply also say “Powered by GreenReserve” is decided later. Links are short paths on our own domain (greenreserve.app/b/…, /p/…, /r/…, /a/…). A text over 160 characters is sent and billed as two.</p>
  <div class="texts">${rows}</div>`;
}
function inventoryScreen(){
  const total=INV.reduce((a,g)=>a+g.rows.length,0),built=INV.reduce((a,g)=>a+g.rows.filter(r=>r[1]!=='planned').length,0);
  const tally=k=>INV.reduce((a,g)=>a+g.rows.filter(r=>r[4]===k).length,0);
  return `<div class="counts"><span><b>${built}</b> emails built</span><span><b>${total-built}</b> planned</span><span><b>${TX.length}</b> texts</span><span><b>${tally('remove')}</b> to remove</span><span><b>${tally('merge')}</b> to merge</span><span><b>${tally('emoji')}</b> with emojis</span></div>
  <div class="groups">${INV.map(g=>`<section class="card"><h2>${g.g} <span style="font-family:var(--sans);font-size:13px;color:var(--muted);font-weight:500">${g.rows.length}</span></h2>
   <div class="scroller"><table class="tbl" style="min-width:720px"><thead><tr><th>Email</th><th>Trigger</th><th>Sent from</th><th>Code</th><th>New system</th></tr></thead><tbody>
   ${g.rows.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[2])}</td><td>${/^Golfers/.test(g.g)?'noreply@ as the course':esc(r[3])}</td><td><code>${esc(r[1])}</code></td><td><span class="dot ${STATUS[r[4]][0]}">${STATUS[r[4]][1]}</span></td></tr>`).join('')}
   </tbody></table></div></section>`).join('')}</div>`;
}
function questionsScreen(){
  const q=[
  ];
  if(!q.length)return '<div class="qs"><div class="card q"><h3>No open questions</h3><p>Everything on this page reflects your decisions so far.</p></div></div>';
  return `<div class="qs">${q.map(x=>`<div class="card q"><h3>${x[0]}</h3><p>${x[1]}</p></div>`).join('')}</div>`;
}
function draw(){
  tabs();
  const el=document.getElementById('main');
  el.innerHTML=S.screen==='emails'?emailsScreen():S.screen==='texts'?textsScreen():S.screen==='inventory'?inventoryScreen():questionsScreen();
  save();
}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  for(const k of ['screen','opt','width','accent','txt']){if(b.dataset[k]){S[k]=b.dataset[k];draw();return}}
});
document.addEventListener('change',e=>{if(e.target.id==='mailsel'){S.mail=e.target.value;draw();document.getElementById('mailsel').focus()}});
draw();
</script>
