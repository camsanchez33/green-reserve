name: Schema drift check

on:
  push:
    paths:
      - 'prisma/schema.prisma'
      - 'prisma/migrations/**'
      - '.github/workflows/schema-check.yml'
  pull_request:
    paths:
      - 'prisma/schema.prisma'
      - 'prisma/migrations/**'
      - '.github/workflows/schema-check.yml'

jobs:
  schema-check:
    name: Migration files match schema
    runs-on: ubuntu-latest
    # Each run replays every migration on its own throwaway Postgres. The shared
    # SHADOW_DATABASE_URL was reset by other branches' runs mid-replay (2026-10-22:
    # P1014 "table does not exist" at a different migration on each re-run, while
    # the same commit passed on a private database).
    services:
      shadow:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shadow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      # Verify the committed migration files are in sync with schema.prisma.
      # If schema.prisma has changes not captured in a migration, this fails
      # the build — making "forgot to run migrate dev" a red X before deploy.
      - name: Check for uncommitted schema drift
        run: |
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "postgresql://postgres:postgres@localhost:5432/shadow" \
            --exit-code
