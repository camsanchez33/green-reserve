name: codemap

# CODEMAP_SPEC CM-1 §4, changed 2026-11-14 (Cam: stop the merge churn): docs/CODEMAP.md and
# docs/codemap.json are no longer committed. Every session regenerates them at start (the
# SessionStart hook in .claude/settings.json), so the map is always current and PRs never
# conflict on it. This job still runs the generator, which fails on a duplicate @brain concept.
#
# This is the whole reason the map is worth having. ARCHITECTURE.md was accurate
# the day it was written and wrong within a month, because nothing failed when it
# drifted. A map that can lie is worse than no map: it gets trusted.

on:
  pull_request:
  push:
    branches: [main]

# Reads the tree and diffs it; nothing needs write access or a secret.
permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # Exits non-zero on its own if two files claim the same @brain concept, so
      # a duplicate source of truth fails CI before the drift check even runs.
      - name: Regenerate the code map
        run: node scripts/codemap.mjs
