name: codemap

# CODEMAP_SPEC CM-1 §4, changed 2026-11-14 (Cam: stop the merge churn): docs/CODEMAP.md and
# docs/codemap.json are no longer committed. Every session regenerates them at start (the
# SessionStart hook in .claude/settings.json) and before relying on them, so PRs never
# conflict on it. This job still runs the generator, which fails on a duplicate @brain concept.

on:
  pull_request:
  push:
    branches: [main]

# Reads the tree; nothing needs write access or a secret.
permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # Exits non-zero on its own if two files claim the same @brain concept, so a
      # duplicate source of truth fails CI. (The job keeps the name `drift` for required checks.)
      - name: Regenerate the code map
        run: node scripts/codemap.mjs
