name: Type Check

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      # MP-9: no new hand-typed card / eyebrow / input class strings on staff
      # surfaces — use the shared components (see the script header).
      - name: Design-system guard
        run: node scripts/design-guard.mjs

      # DENSE (DENSE_UI_SPEC P9): dashboard and admin pages may lose prose, never
      # gain it — see the script header.
      - name: Words guard
        run: node scripts/words-guard.mjs
