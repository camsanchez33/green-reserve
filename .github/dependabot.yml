# SEC-1 (Cam 2026-10-26): weekly update PRs so a fixed flaw is never more than
# a week from a PR. Minor and patch updates come grouped as one PR; majors come
# one at a time (they need a person to read the changelog). Security fixes are
# opened as soon as GitHub publishes them, outside this schedule.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
